<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1730"><title>PanBill Agent Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0b1730;--navy2:#142746;--gold:#d9ad50;--bg:#f4f6fa;--ink:#172238;--muted:#68758b;--line:#e5e9f0;--white:#fff;--green:#16845b;--red:#b8323a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:850;letter-spacing:.4px;font-size:21px}.brand span{color:var(--gold)}.top small{display:block;color:#c7d0df;margin-top:3px}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.panel,.card,.stat{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #12213b0a}.login{max-width:440px;margin:8vh auto;padding:26px}.login h1{margin:0 0 7px;font-size:24px}.muted{color:var(--muted)}label{display:block;font-weight:650;font-size:13px;margin:16px 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid #d7deea;border-radius:10px;background:#fff;color:var(--ink)}button{border:0;border-radius:10px;padding:12px 16px;background:var(--gold);color:#1c2432;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.primary{width:100%;margin-top:18px}.secondary{background:#e9edf4;color:var(--navy)}.logout{background:transparent;border:1px solid #73839d;color:#fff;padding:9px 13px}.error{color:var(--red);font-size:13px;margin-top:12px}.success{color:var(--green);font-size:13px;margin-top:12px}.hidden{display:none!important}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.welcome h1{font-size:25px;margin:0 0 5px}.tag{display:inline-block;background:#fff4d9;color:#805a10;padding:6px 10px;border-radius:30px;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.stat{padding:17px}.stat b{font-size:26px;display:block}.stat small{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 12px}.section-head h2{margin:0;font-size:19px}.orders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{padding:17px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card h3{margin:0 0 5px;font-size:16px}.order-no{font-size:12px;color:var(--muted)}.status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:30px;background:#edf1f7;color:#33445d;white-space:nowrap}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.detail small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.detail strong{font-size:13px;overflow-wrap:anywhere}.notes{font-size:13px;background:#f7f8fb;padding:10px;border-radius:9px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.actions label{margin:0 0 6px}.actions button{height:44px}.confirm-cash{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#fff8e8;border:1px solid #ead7aa;border-radius:10px;margin:12px 0;font-size:13px;line-height:1.45}.confirm-cash input{width:18px;height:18px;margin:1px 0 0;flex:0 0 auto}.confirm-cash label{margin:0;font-weight:600}.empty{padding:32px;text-align:center;color:var(--muted);grid-column:1/-1}.message{padding:12px;border-radius:10px;margin:12px 0;font-size:13px;background:#fff4d9;color:#76520c}.foot{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(max-width:700px){.stats{grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px}.stat b{font-size:21px}.orders{grid-template-columns:1fr}.welcome h1{font-size:21px}.details{gap:10px}.top{padding:15px 16px}}
@media(max-width:380px){.stats{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.actions button{width:100%}}
</style></head>
<body>
<header class="top"><div><div class="brand">Pan<span>Bill</span> Agent</div><small>Marketplace fulfillment portal</small></div><button id="logoutBtn" class="logout hidden">Sign out</button></header>
<main class="wrap">
<section id="loginPanel" class="panel login"><h1>Agent sign in</h1><p class="muted">Sign in with your existing PanBill account details.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Your PanBill password"><button id="loginBtn" class="primary" type="submit">Sign in to dashboard</button></form><div id="loginMessage" aria-live="polite"></div></section>
<section id="dashboard" class="hidden"><div class="welcome"><div><h1 id="agentName">Welcome</h1><p class="muted" id="agentMeta">Your assigned marketplace orders</p></div><span class="tag" id="agentType">AGENT</span></div><div id="pageMessage" class="message hidden" aria-live="polite"></div><div class="stats"><div class="stat"><b id="totalCount">0</b><small>Active assignments</small></div><div class="stat"><b id="pickupCount">0</b><small>Pickup tasks</small></div><div class="stat"><b id="deliveryCount">0</b><small>Delivery tasks</small></div></div><div class="section-head"><h2>My assigned orders</h2><button id="refreshBtn" class="secondary" type="button">Refresh</button></div><div id="orders" class="orders"><div class="empty">Loading your assignments...</div></div></section>
</main><div class="foot">PanBill · Secure fulfillment access</div>
<script>
const SUPABASE_URL="https://rbvmtrsftnmnlxjmewpp.supabase.co";
const SUPABASE_KEY="sb_publishable_Fn6FE75bdj11K39ZMxMRpA_EtFUrKTE";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let currentAgent=null, assignments=[];
function escapeHTML(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showMessage(message,type="error",target="loginMessage"){const el=$(target);el.className=type;el.textContent=message;}
function formatMoney(v){const n=Number(v);return Number.isFinite(n)?"₦"+n.toLocaleString("en-NG"):"—";}
async function request(body){const {data,error}=await client.functions.invoke("marketplace-admin",{body});if(error){let msg=error.message||"Request failed.";if(error.context&&typeof error.context.json==="function"){try{const x=await error.context.json();if(x.error)msg=x.error;}catch(_){}}throw new Error(msg);}if(!data||data.success===false)throw new Error(data?.error||"Request failed.");return data;}
function normalizeOrder(value){return Array.isArray(value)?value[0]:value;}
function statusOptions(type){return type==="pickup"?[["parcel_received","Parcel received"],["ready_for_collection","Ready for collection"],["collected","Customer collected parcel"]]:[["out_for_delivery","Out for delivery"],["delivered","Delivered"],["delivery_failed","Delivery failed"],["returned","Returned"]];}
function renderOrders(){
 const root=$("orders");
 if(!assignments.length){root.innerHTML='<div class="empty">You have no active assigned orders right now.</div>';return;}
 root.innerHTML=assignments.map((a,index)=>{
  const o=normalizeOrder(a.marketplace_orders)||{}, pickup=currentAgent.agent_type==="pickup";
  const cod=String(o.payment_method||"").toLowerCase()==="cash_on_delivery";
  const pod=String(o.payment_method||"").toLowerCase()==="pay_on_delivery";
  const isCodPickup=pickup&&cod;
  const transfer=a.pod_transfer||null;
  let options=statusOptions(currentAgent.agent_type);
  if(pod)options=options.filter(([v])=>v!=="collected"&&v!=="delivered");
  const optionHtml=options.map(([v,l])=>`<option value="${v}" ${a.fulfillment_status===v?"selected":""}>${l}</option>`).join("");
  const address=[o.delivery_address,o.delivery_city,o.delivery_lga,o.delivery_state].filter(Boolean).join(", ");
  const cashControl=isCodPickup?`<div class="confirm-cash"><input id="cash-confirm-${index}" type="checkbox"><label for="cash-confirm-${index}">I confirm that I have handed the parcel to the customer and physically received the full cash payment. I understand that confirming without receiving the cash is not allowed.</label></div>`:"";
  const paymentNote=pod?"Pay on Delivery: generate the order-specific Paystack bank-transfer account at handover. Never accept payment into a personal account. PanBill completes the order automatically after Paystack verification.":isCodPickup?"Cash on delivery: the assigned pickup agent must receive the customer's cash before selecting Customer collected parcel.":(cod?"Cash on delivery: collection confirmation is restricted to the assigned pickup agent.":"Payment: "+String(o.payment_status||"unknown").replaceAll("_"," "));
  const stageReady=pickup?a.fulfillment_status==="ready_for_collection":a.fulfillment_status==="out_for_delivery";
  const disableStatusUpdate=pod&&pickup&&a.fulfillment_status==="ready_for_collection";
  const transferPanel=pod?(transfer?`<div class="notes pod-transfer"><b>Paystack transfer account</b><br>Bank: <strong>${escapeHTML(transfer.bank_name||"—")}</strong><br>Account name: <strong>${escapeHTML(transfer.account_name||"—")}</strong><br>Account number: <strong>${escapeHTML(transfer.account_number||"—")}</strong><br>Exact amount: <strong>${formatMoney(transfer.amount||o.total_amount)}</strong><br>Expires: <strong>${escapeHTML(transfer.expires_at?new Date(transfer.expires_at).toLocaleString():"—")}</strong><br><small>Give these details to the buyer. Wait for PanBill's automatic payment confirmation; do not mark this order delivered manually.</small></div>`:(stageReady?`<div class="notes"><b>Paystack transfer account not generated.</b><br>Generate it when the buyer is ready to pay at handover.</div><button type="button" class="secondary pod-generate" data-pod-index="${index}">Generate unique transfer account</button>`:`<div class="notes">Move this order to ${pickup?"Ready for collection":"Out for delivery"} before generating the buyer's transfer account.</div>`)):"";
  return `<article class="card"><div class="card-head"><div><h3>Order ${escapeHTML(o.order_number||o.id||"—")}</h3><div class="order-no">Assigned ${escapeHTML(a.assigned_at?new Date(a.assigned_at).toLocaleString():"—")}</div></div><span class="status">${escapeHTML(String(a.fulfillment_status||a.status||"assigned").replaceAll("_"," ").toUpperCase())}</span></div><div class="details"><div class="detail"><small>Customer</small><strong>${escapeHTML(o.delivery_name||"Marketplace buyer")}</strong></div><div class="detail"><small>Phone</small><strong>${escapeHTML(o.delivery_phone||"Not provided")}</strong></div><div class="detail"><small>${pickup?"Collection point":"Delivery address"}</small><strong>${escapeHTML(pickup?"Assigned pickup station":(address||"Not provided"))}</strong></div><div class="detail"><small>Order total</small><strong>${formatMoney(o.total_amount)}</strong></div><div class="detail"><small>Order status</small><strong>${escapeHTML(String(o.order_status||"—").replaceAll("_"," "))}</strong></div><div class="detail"><small>Payment</small><strong>${escapeHTML(String(o.payment_status||"—").replaceAll("_"," "))}</strong></div></div>${o.delivery_notes?`<div class="notes"><b>Customer instructions:</b> ${escapeHTML(o.delivery_notes)}</div>`:""}${a.notes?`<div class="notes"><b>Assignment note:</b> ${escapeHTML(a.notes)}</div>`:""}<div class="notes"><b>Collection instructions:</b> ${escapeHTML(paymentNote)}</div>${transferPanel}${cashControl}<div class="actions"><div><label for="product-id-${index}">Verify Product ID (required)</label><input id="product-id-${index}" type="text" inputmode="text" autocomplete="off" maxlength="80" placeholder="Enter or scan a Product ID" required><label for="status-${index}">Update fulfillment status</label><select id="status-${index}" data-status-index="${index}">${optionHtml}</select></div><button type="button" data-update-index="${index}" ${disableStatusUpdate?"disabled":""}>${disableStatusUpdate?"Awaiting payment":"Update"}</button></div><div id="result-${index}" aria-live="polite"></div></article>`;
 }).join("");
 root.querySelectorAll("[data-update-index]").forEach(btn=>btn.addEventListener("click",()=>updateStatus(Number(btn.dataset.updateIndex),btn)));
 root.querySelectorAll("[data-pod-index]").forEach(btn=>btn.addEventListener("click",()=>createPodTransfer(Number(btn.dataset.podIndex),btn)));
}
async function loadAssignments(){
 const root=$("orders");root.innerHTML='<div class="empty">Loading your assignments...</div>';
 try{
  const data=await request({action:"agent_orders_list"});currentAgent=data.agent;assignments=data.assignments||[];
  $("agentName").textContent="Welcome, "+(currentAgent.full_name||"Agent");
  $("agentMeta").textContent=(currentAgent.phone||"")+(currentAgent.agent_type==="pickup"?" · Pickup agent":" · Doorstep delivery agent");
  $("agentType").textContent=currentAgent.agent_type==="pickup"?"PICKUP AGENT":"DELIVERY AGENT";
  $("totalCount").textContent=assignments.length;$("pickupCount").textContent=assignments.filter(a=>a.assignment_type==="pickup").length;$("deliveryCount").textContent=assignments.filter(a=>a.assignment_type==="delivery").length;renderOrders();
 }catch(e){root.innerHTML=`<div class="empty">${escapeHTML(e.message)}</div>`;}
}
async function createPodTransfer(index,button){
 const a=assignments[index];if(!a)return;
 button.disabled=true;button.textContent="Generating account…";
 try{
  const data=await request({action:"agent_create_pod_transfer",assignment_id:a.id});
  a.pod_transfer=data.pod_transfer||null;
  renderOrders();
  const result=$("result-"+index);if(result){result.className="success";result.textContent=data.already_created?"Existing active Paystack transfer account loaded.":"Unique Paystack transfer account generated. Share these details with the buyer.";}
 }catch(e){const result=$("result-"+index);if(result){result.className="error";result.textContent=e.message;}}
 finally{button.disabled=false;button.textContent="Generate unique transfer account";}
}
async function updateStatus(index,button){
 const a=assignments[index];if(!a)return;
 const select=$(`status-${index}`),productInput=$(`product-id-${index}`),productId=productInput.value.trim();
 const o=normalizeOrder(a.marketplace_orders)||{},isCodPickup=currentAgent.agent_type==="pickup"&&String(o.payment_method||"").toLowerCase()==="cash_on_delivery",isPod=String(o.payment_method||"").toLowerCase()==="pay_on_delivery";
 if(isPod&&(select.value==="collected"||select.value==="delivered")){$("result-"+index).className="error";$("result-"+index).textContent="Pay on Delivery is completed automatically after Paystack verifies the bank transfer.";return;}
 if(!productId){$(`result-${index}`).className="error";$(`result-${index}`).textContent="Enter or scan the Product ID before updating this order.";productInput.focus();return;}
 if(isCodPickup&&select.value==="collected"&&!$(`cash-confirm-${index}`).checked){$(`result-${index}`).className="error";$(`result-${index}`).textContent="Please confirm that you physically received the customer's cash before marking this order collected.";return;}
 if(isCodPickup&&select.value==="collected"&&!window.confirm("Confirm that the parcel was handed to the customer and the full cash payment was physically received? This action updates payment, stock, assignment and seller payout eligibility."))return;
 button.disabled=true;button.textContent="Updating...";
 try{
  await request({action:"agent_update_status",assignment_id:a.id,fulfillment_status:select.value,product_id:productId});
  $(`result-${index}`).className="success";$(`result-${index}`).textContent=isCodPickup&&select.value==="collected"?"COD collection confirmed. Payment, stock, assignment and payout eligibility have been updated.":"Status updated successfully. Product ID verified.";
  await loadAssignments();
 }catch(e){$(`result-${index}`).className="error";$(`result-${index}`).textContent=e.message;}
 finally{button.disabled=false;button.textContent="Update";}
}
function showDashboard(){$("loginPanel").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");loadAssignments();}
function showLogin(message=""){$("dashboard").classList.add("hidden");$("loginPanel").classList.remove("hidden");$("logoutBtn").classList.add("hidden");if(message)showMessage(message);}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("loginBtn");btn.disabled=true;btn.textContent="Signing in...";$("loginMessage").textContent="";try{const {error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;showDashboard();}catch(e){showMessage(e.message||"Unable to sign in.");}finally{btn.disabled=false;btn.textContent="Sign in to dashboard";}});
$("logoutBtn").addEventListener("click",async()=>{await client.auth.signOut();currentAgent=null;assignments=[];showLogin("You have signed out.");});
$("refreshBtn").addEventListener("click",loadAssignments);
client.auth.getSession().then(({data,error})=>{if(error)showLogin(error.message);else if(data.session)showDashboard();});
client.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showLogin();});
</script></body></html>
