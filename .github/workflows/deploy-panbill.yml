name: Deploy PanBill Edge Function

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/super-responder/**"
      - ".github/workflows/deploy-panbill.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy super-responder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy super-responder --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
